<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06110e"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
<title>MYRA Personal AI</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 25%,#0c3325,#06110e 60%);color:#eafff4;font-family:system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:auto;padding:24px 18px 40px;text-align:center}h1{letter-spacing:4px;color:#58ffad}.sub,.note,footer{color:#9cb9ab;font-size:12px}
#orb{width:164px;height:164px;margin:28px auto;border-radius:50%;background:radial-gradient(circle,#eafff5 0%,#73ffc0 5%,#20db88 14%,#08764b 34%,#042c20 58%,transparent 72%);box-shadow:0 0 28px #26ff9b,0 0 70px #0d7d51;animation:pulse 2.5s infinite}
@keyframes pulse{50%{transform:scale(1.06);filter:hue-rotate(15deg)}}#orb.listening{animation:pulse .65s infinite}
#status{min-height:24px;color:#58ffad;margin-bottom:14px}textarea{width:100%;min-height:100px;border:1px solid #285743;border-radius:15px;padding:14px;background:#0a1712;color:white;font:inherit}
.row{display:flex;gap:10px;margin:12px 0}.row button{flex:1}button{border:0;border-radius:12px;padding:13px 8px;background:#58ffad;color:#052116;font-weight:750;font-size:15px}button.secondary{background:#16392b;color:#dffff0;border:1px solid #2a664b}button:disabled{opacity:.5}
h2{text-align:left;font-size:16px;margin:24px 0 10px}#answer{white-space:pre-wrap;text-align:left;line-height:1.65;min-height:86px;padding:16px;border:1px solid #1c4635;border-radius:15px;background:#0b1914;overflow-wrap:anywhere}.note{line-height:1.5;margin-top:22px}
</style></head><body><main><h1>MYRA AI</h1><div class="sub">YOUR PERSONAL ASSISTANT</div><div id="orb"></div>
<div id="status">প্রস্তুত। লিখো অথবা কথা বলো।</div><textarea id="question" maxlength="4000" placeholder="বাংলায় প্রশ্ন লেখো..."></textarea>
<div class="row"><button id="listenBtn">🎙 কথা বলো</button><button id="sendBtn">➤ পাঠাও</button></div>
<h2>AI-এর উত্তর</h2><div id="answer" aria-live="polite">হ্যালো! আমি তোমার MYRA Personal Assistant।</div>
<div class="row"><button class="secondary" id="speakBtn">🔊 উত্তর শোনো</button><button class="secondary" id="stopBtn">■ থামাও</button></div>
<div class="row"><button class="secondary" id="youtubeBtn">▶ YouTube খোলো</button><button class="secondary" id="clearBtn">মুছে ফেলো</button></div>
<p class="note">ভয়েস ফিচার ব্রাউজার/ডিভাইসভেদে ভিন্ন হতে পারে। এই অ্যাপ নিজে থেকে SMS পাঠায়, অন্য অ্যাপের স্ক্রিন পড়ে বা ফোনের সেটিংস বদলায় না।</p><footer>MYRA Starter • Web + installable PWA</footer></main>
<script>
const API_URL="PASTE_YOUR_CLOUDFLARE_WORKER_URL_HERE";
const $=id=>document.getElementById(id), statusEl=$("status"),answerEl=$("answer"),orb=$("orb");
function status(t){statusEl.textContent=t}
$("sendBtn").onclick=ask;$("listenBtn").onclick=listen;$("speakBtn").onclick=speak;$("stopBtn").onclick=stopVoice;
$("clearBtn").onclick=()=>{$("question").value="";answerEl.textContent="";status("মুছে ফেলা হয়েছে।")};
$("youtubeBtn").onclick=()=>window.open("https://www.youtube.com/","_blank","noopener");
async function ask(){const message=$("question").value.trim();if(!message){status("আগে প্রশ্ন লেখো।");return}
if(API_URL.includes("PASTE_YOUR_")){status("আগে index.html-এ Worker URL বসাও।");answerEl.textContent="Cloudflare Worker তৈরি করে তার URL এখানে বসাতে হবে।";return}
$("sendBtn").disabled=true;answerEl.textContent="AI উত্তর তৈরি করছে...";status("সংযোগ করা হচ্ছে...");
try{const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});const data=await res.json();if(!res.ok)throw Error(data.error||"অনুরোধ ব্যর্থ");
answerEl.textContent=data.answer||"উত্তর পাওয়া যায়নি।";status("উত্তর প্রস্তুত।")}catch(e){answerEl.textContent="সংযোগে সমস্যা। Worker URL, ইন্টারনেট ও Backend সেটআপ পরীক্ষা করো।";status("সংযোগ ব্যর্থ।")}finally{$("sendBtn").disabled=false}}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status("এই ব্রাউজারে voice recognition নেই। লিখে পাঠাও।");return}
const r=new SR();r.lang="bn-BD";r.interimResults=false;r.maxAlternatives=1;r.onstart=()=>{status("শুনছি... এখন বলো।");orb.classList.add("listening")};r.onresult=e=>{$("question").value=e.results[0][0].transcript;status("কথা লেখা হয়েছে। পাঠাও চাপো।")};r.onerror=e=>status("মাইক্রোফোন সমস্যা: "+e.error);r.onend=()=>orb.classList.remove("listening");try{r.start()}catch(e){status("আবার চেষ্টা করো বা লিখে পাঠাও।")}}
function speak(){if(!("speechSynthesis"in window)){status("এই ডিভাইসে text-to-speech নেই।");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(answerEl.textContent);u.lang="bn-BD";u.rate=1;speechSynthesis.speak(u)}
function stopVoice(){if("speechSynthesis"in window)speechSynthesis.cancel();status("ভয়েস বন্ধ।")}
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
